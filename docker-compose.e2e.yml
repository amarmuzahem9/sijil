# e2e overlay — used only by scripts/e2e.sh (isolated project "sijil-e2e", fresh volumes).
#   docker compose -p sijil-e2e -f docker-compose.yml -f docker-compose.e2e.yml ...
services:
  api:
    environment:
      APP_ENV: test
      # Never use the developer's real Maps key in e2e: the tests expect no map (or serve a fake
      # one), and must not send requests to Google on the owner's account.
      GOOGLE_MAPS_API_KEY: ""
      GOOGLE_MAPS_MAP_ID: ""
      # The synthetic card reader (specs/006 research.md R10): no models, no real cards.
      OCR_MODE: fake
      # The in-memory OTP sender with a fixed code (specs/007 research.md R8): no WhatsApp
      # message is sent and no code ever appears in a response or log.
      OTP_MODE: fake
      OTP_FAKE_CODE: "246810"
      OTPIQ_API_KEY: ""
      # Generated legacy card images (specs/014 research R7): never Google Drive, never real cards.
      DRIVE_MODE: fake

  # The real reader is not built or started in e2e (4 GB image; the fake reader is used).
  ocr:
    profiles: ["ocr-real"]

  proxy:
    ports: !reset []
    volumes:
      - ./deploy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
      - ./deploy/common.caddy:/etc/caddy/common.caddy:ro

  e2e:
    build:
      context: ./e2e
    profiles: ["e2e"]
    environment:
      E2E_BASE_URL: https://proxy
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DEMO_MARKETER_PASSWORD: ${DEMO_MARKETER_PASSWORD}
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      - proxy
