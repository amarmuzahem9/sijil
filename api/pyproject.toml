[project]
name = "sijil-api"
version = "0.1.0"
description = "Sijil backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "psycopg[binary]==3.3.9",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "tzdata==2026.6",
    # Feature 005: multipart uploads and card image verification (research.md R6).
    "python-multipart==0.0.34",
    "Pillow==13.0.0",
    # Feature 006: calls the internal card reader service (specs/006 research R5).
    "httpx==0.28.1",
    # Feature 014: read the legacy Google Form export (.xlsx); defusedxml guards openpyxl's XML
    # parser (specs/014 research R4).
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
markers = ["slow: a volume check (specs/015 T053); still part of the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
# The backup tools (age, pg_dump, pg_restore) run as fixed argv lists without a shell
# (specs/016 research R2); no argument comes from a user. S108: the plaintext identity goes to a
# mkdtemp folder (random name, mode 700) under tmpfs /dev/shm, and the healthcheck file holds
# nothing. S606: keyfile execs `age` in a pseudo-terminal child, without a shell.
"app/backup/**" = ["S603", "S607", "S108", "S606"]
